<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="יש שאלה נקודתית? אפשר לפנות ישירות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="one-screen narrow-header">

<a href="#main" class="skip-link">דלג לתוכן</a>

<header class="site">
  <div class="wrap nav-row">
    <a class="brand brand-home" href="index.html"><span class="mark"></span> <span class="brand-name">התצפית</span> <span class="brand-tagline">בהירות ניהולית לעמותות</span></a>
    <nav class="links">
      <a href="knowledge/index.html">מרכז ידע</a>
      <a href="about.html">אודות</a>
      <a href="contact.html">צור קשר</a>
    </nav>
  </div>
</header>

<section class="subhero">
  <div class="wrap">
    <h1>אתה כאן כי משהו מעסיק אותך?!</h1>
    <p class="lede">אתה לא צריך עוד מאמר כללי. אם יש לך שאלה ספציפית על העמותה שלך — אפשר לכתוב לי.</p>
  </div>
</section>

<main id="main">
  <form class="contact-form contact-split" id="contact-form">
    <div class="contact-col-fields">
      <div class="field">
        <label for="cf-name">שם מלא</label>
        <input type="text" id="cf-name" placeholder="ישראל ישראלי" required>
      </div>
      <div class="field">
        <label for="cf-email">דואר אלקטרוני</label>
        <input type="email" id="cf-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="cf-subject">סיווג הפנייה</label>
        <select id="cf-subject">
          <option>שאלה על מדריך במרכז הידע</option>
          <option>שאלה ספציפית על העמותה שלי</option>
          <option>שיתוף פעולה / הצעה עסקית</option>
          <option>דיווח על טעות באתר</option>
          <option>אחר</option>
        </select>
      </div>
      <p class="contact-note">הלחיצה תפתח את תוכנית המייל שלך עם ההודעה מוכנה לשליחה — אין כאן שרת שאוגר את הנתונים.</p>
    </div>

    <div class="contact-col-message">
      <div class="field field-grow">
        <label for="cf-message">תוכן ההודעה</label>
        <textarea id="cf-message" placeholder="איך אפשר לעזור?" required></textarea>
      </div>
      <button type="submit" class="btn primary contact-submit">שליחת הפנייה</button>
    </div>
  </form>
</main>

<footer class="site">
  <div class="wrap">
    <span>© התצפית</span>
    <span><a href="accessibility.html">נגישות</a></span>
    <span><a href="sitemap.html">מפת אתר</a></span>
    <span><a href="contact.html">צור קשר</a></span>
  </div>
</footer>

<script src="scripts.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = document.getElementById('cf-name').value;
  var email = document.getElementById('cf-email').value;
  var subject = document.getElementById('cf-subject').value;
  var message = document.getElementById('cf-message').value;
  var body = 'שם: ' + name + '\nאימייל: ' + email + '\n\n' + message;
  var mailto = 'mailto:hatazpit.office@gmail.com'
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);
  window.location.href = mailto;
});
</script>
</body>
</html>
