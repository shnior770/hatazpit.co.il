<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת הזדמנות תמיכה | התצפית</title>
<meta name="description" content="בדיקה קצרה המבוססת על נתוני תמיכות ממשלתיות אמיתיים לפי סעיף 3א.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* טוקנים מהאתר החי (../styles.css) — מועתקים ידנית כדי לשמור עמוד עצמאי */
:root{
  --bg:#0c211c; --bg-raised:#12332b; --bg-raised-2:#163d33;
  --ink:#eef4f1; --ink-soft:#a9c2ba; --line:rgba(255,255,255,0.10);
  --cream:#f5efe0; --teal:#2fd6c0; --teal-deep:#1cb6a1; --teal-light:#8be8db;
  --amber:#f5b23c; --coral:#ef6461;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik','Segoe UI',system-ui,sans-serif;direction:rtl;text-align:right}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
a{color:var(--teal);text-decoration:none}

header.site{background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--cream)}
.brand .mark{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-light));display:inline-block;box-shadow:0 0 12px rgba(47,214,192,.5)}

.page{position:relative;overflow:hidden;padding:0 28px;background:radial-gradient(circle at 86% 18%,rgba(47,214,192,.08),transparent 27rem),linear-gradient(145deg,#0c211c 0%,#0e2822 52%,#091a15 100%)}
.ambient{position:fixed;border-radius:999px;pointer-events:none;opacity:.45}
.ambient-one{width:360px;height:360px;background:rgba(47,214,192,.05);left:-170px;bottom:-130px}
.ambient-two{width:220px;height:220px;border:1px solid rgba(245,178,60,.08);right:-70px;top:22%}

.simulator-shell{max-width:1100px;margin:52px auto 34px;min-height:600px;display:grid;grid-template-columns:minmax(0,1fr) 310px;background:var(--bg-raised);border:1px solid var(--line);border-radius:26px;box-shadow:0 35px 100px rgba(0,0,0,.28);overflow:hidden}
.simulator-main{min-height:600px;padding:58px 64px;display:flex;align-items:center}
.simulator-main>div{width:100%}
.context-panel{min-height:100%;padding:52px 34px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.context-label,.question-eyebrow{display:block;margin-bottom:12px;color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.04em}
.context-panel strong{display:block;font-size:20px;line-height:1.45;color:var(--cream)}
.context-panel p{color:var(--ink-soft);font-size:13px;line-height:1.75;margin:12px 0 0}
.context-divider{height:1px;background:var(--line);margin:28px 0}
.context-panel blockquote{margin:0;padding:0;color:var(--ink);font-size:15px;line-height:1.75}
.privacy-line{margin-top:32px;padding-top:18px;border-top:1px dashed var(--line);color:var(--ink-soft);font-size:12px;display:flex;gap:8px;align-items:center}
.privacy-line span{color:var(--teal)}

.pill,.result-kicker{display:inline-flex;align-items:center;padding:6px 12px;margin-bottom:18px;border-radius:99px;background:rgba(47,214,192,.1);border:1px solid rgba(47,214,192,.25);color:var(--teal-light);font-size:12px;font-weight:800}
.entry-screen h1{max-width:690px;margin:0;font-size:clamp(32px,4.2vw,54px);line-height:1.12;letter-spacing:-.03em;color:var(--cream)}
.lead-copy{max-width:650px;margin:24px 0 30px;color:var(--ink-soft);font-size:19px;line-height:1.7}
.microcopy{color:var(--ink-soft);opacity:.75;font-size:12px;margin:15px 2px 0}

.primary-button{min-height:52px;padding:14px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#06231d;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(28,182,161,.15);transition:transform .16s ease,filter .16s ease}
.primary-button:hover{filter:brightness(1.06);transform:translateY(-1px)}
.primary-button:disabled{opacity:.6;cursor:default;transform:none}
.primary-button:focus-visible,.answer-option:focus-visible,.domain-option:focus-visible,.back-button:focus-visible,.restart-button:focus-visible{outline:3px solid rgba(245,178,60,.7);outline-offset:3px}
.primary-button .arrow{margin-right:8px}

.progress-row{display:flex;align-items:center;gap:16px;margin-bottom:40px;color:var(--ink-soft);font-size:12px}
.progress-track{flex:1;height:4px;overflow:hidden;border-radius:4px;background:rgba(255,255,255,.08)}
.progress-value{height:100%;background:var(--teal);border-radius:4px;transition:width .25s ease}
.question-screen h2,.result-screen h2,.lead-screen h2,.thanks-screen h2{margin:0;font-size:clamp(26px,3vw,40px);line-height:1.22;letter-spacing:-.03em;color:var(--cream)}
.question-note,.result-intro,.lead-screen>p,.thanks-screen>p{max-width:660px;margin:14px 0 25px;color:var(--ink-soft);font-size:16px;line-height:1.7}

.options-list{display:grid;gap:10px;margin-top:28px}
.answer-option{width:100%;min-height:70px;padding:15px 19px;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:right;border-radius:13px;border:1px solid var(--line);background:var(--bg-raised-2);color:var(--ink);cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.answer-option:hover{border-color:rgba(47,214,192,.55);background:#18443a;transform:translateX(-2px)}
.answer-option:disabled{cursor:default}
.answer-option strong{display:block;font-size:15px}
.answer-option small{display:block;color:var(--ink-soft);font-size:12px;margin-top:5px}
.option-arrow{color:var(--teal);font-size:20px}

.domain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
.domain-option{min-height:66px;padding:11px 13px;display:flex;align-items:center;gap:12px;text-align:right;border:1px solid var(--line);border-radius:13px;background:var(--bg-raised-2);color:var(--ink);font-weight:700;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.domain-option:hover{border-color:rgba(47,214,192,.55);transform:translateY(-1px)}
.domain-option:disabled{cursor:default}
.domain-icon{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;background:rgba(47,214,192,.1);color:var(--teal);font-size:11px;font-weight:900}
.back-button,.restart-button{margin-top:20px;padding:6px 0;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.restart-button{display:block;margin:16px auto 0}

.result-kicker.strong{color:#06231d;background:var(--teal);border-color:var(--teal)}
.result-kicker.medium{color:var(--amber);background:rgba(245,178,60,.1);border-color:rgba(245,178,60,.3)}
.result-kicker.open{color:var(--coral);background:rgba(239,100,97,.1);border-color:rgba(239,100,97,.28)}
.result-intro{margin-bottom:24px}
.data-card{margin:20px 0;padding:20px;border:1px solid rgba(245,178,60,.25);border-right:3px solid var(--amber);border-radius:14px;background:rgba(245,178,60,.075)}
.data-card-head{display:flex;justify-content:space-between;gap:15px;font-size:13px;font-weight:800;color:var(--ink)}
.data-source{color:var(--amber);font-size:11px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px}
.metrics div{padding-left:12px;border-left:1px solid rgba(255,255,255,.11)}
.metrics div:last-child{border-left:0}
.metrics strong{display:block;color:var(--amber);font-size:32px;font-weight:800;letter-spacing:-.01em}
.metrics span{display:block;margin-top:4px;color:var(--ink-soft);font-size:11px}
.data-card p{margin:0;color:var(--ink-soft);font-size:11px;line-height:1.65}
.data-card.no-data strong{line-height:1.5;color:var(--cream)}
.data-card.no-data p{margin-top:8px}

.reasons{margin:24px 0}
.reasons h3{margin:0 0 11px;font-size:14px;color:var(--cream)}
.reasons ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.reasons li{color:var(--ink);font-size:13px;line-height:1.5}
.reasons li span{color:var(--teal);margin-left:7px}
.result-screen>.primary-button{width:100%}
.lead-screen{position:relative}
.close-button{position:absolute;left:0;top:-12px;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink-soft);font-size:25px;cursor:pointer}
.lead-screen form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:24px}
.lead-screen label{display:grid;gap:7px;color:var(--ink-soft);font-size:12px;font-weight:700}
.lead-screen label:first-child{grid-column:1/-1}
.lead-screen input{width:100%;min-height:48px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg-raised-2);color:var(--ink);outline:none;font-family:inherit}
.lead-screen input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,214,192,.08)}
.lead-screen form .primary-button{grid-column:1/-1;margin-top:4px}
.disclosure{margin-top:16px;padding:12px 14px;border:1px solid rgba(47,214,192,.22);border-radius:10px;background:rgba(47,214,192,.06);color:var(--ink-soft);font-size:11px;line-height:1.6}
.disclosure strong{color:var(--teal-light)}
.thanks-screen{text-align:center;max-width:620px;margin:0 auto}
.thanks-mark{width:66px;height:66px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:rgba(47,214,192,.12);border:1px solid rgba(47,214,192,.35);color:var(--teal);font-size:30px}
.thanks-screen .primary-button{margin-top:8px}
.screen-enter{animation:screen-enter .32s ease both}
@keyframes screen-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

footer.site{border-top:1px solid var(--line);margin-top:0}
footer.site .wrap{padding:12px 24px;color:var(--ink-soft);font-size:.72rem;opacity:.6;text-align:center}

@media(max-width:840px){
  .page{padding:0 15px}
  .simulator-shell{margin-top:24px;grid-template-columns:1fr;min-height:0}
  .simulator-main{min-height:0;padding:36px 25px}
  .context-panel{min-height:0;padding:26px 25px;border-right:0;border-top:1px solid var(--line)}
  .context-divider,.context-panel blockquote{display:none}
  .context-panel.hide-on-mobile{display:none}
  .privacy-line{margin-top:18px;padding-top:14px}
  .entry-screen h1{font-size:34px}
  .lead-copy{font-size:16px}
}
@media(max-width:520px){
  .nav-row{padding:14px 0}
  .simulator-shell{border-radius:20px}
  .simulator-main{padding:28px 18px}
  .entry-screen h1{font-size:29px}
  .domain-grid{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .metrics div{border-left:0;border-bottom:1px solid rgba(255,255,255,.08);padding:8px 0}
  .metrics div:last-child{grid-column:1/-1}
  .lead-screen form{grid-template-columns:1fr}
  .lead-screen label,.lead-screen label:first-child,.lead-screen form .primary-button{grid-column:1}
  .question-screen h2,.result-screen h2,.lead-screen h2,.thanks-screen h2{font-size:26px}
  .answer-option{min-height:64px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a class="brand" href="../index.html"><span class="mark"></span> <span>התצפית</span></a>
  </div>
</header>

<main class="page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <section class="simulator-shell" aria-live="polite">
    <div class="simulator-main" id="simulator-main"></div>
    <aside class="context-panel">
      <div><span class="context-label">על מה זה מבוסס?</span><strong>יותר מ־62 אלף רשומות תמיכה ממשלתיות</strong><p>תשלומי תמיכה אמיתיים מ-2005 עד היום. זה מראה מה קרה בעבר — לא תחזית, ולא הבטחה שתקבלו כסף.</p></div>
      <div class="context-divider"></div>
      <blockquote>"המטרה אינה לתת לכם ציון. המטרה היא לגלות אם יש סיבה טובה לבדוק."</blockquote>
      <div class="privacy-line"><span>◌</span> התשובות נשארות בדפדפן במהלך המילוי.</div>
    </aside>
  </section>
</main>

<footer class="site">
  <div class="wrap"><span>© התצפית</span> <span><a href="../disclaimer.html">כתב ויתור</a></span></div>
</footer>

<script>
  const DOMAINS={
    welfare:{label:'רווחה וסיוע',ministry:'משרד הרווחה',entities:680,payments:3603,median:136677,icon:'לב'},
    education:{label:'חינוך',ministry:'משרד החינוך',entities:584,payments:5507,median:280073,icon:'ספר'},
    torah:{label:'מוסדות תורניים',ministry:'אגף מוסדות תורניים',entities:1408,payments:14594,median:383175,icon:'א'},
    culture:{label:'תרבות וספורט',ministry:'משרד התרבות והספורט',entities:2028,payments:20017,median:150064,icon:'צליל'},
    settlement:{label:'קהילה והתיישבות',ministry:'משרד ההתיישבות',entities:388,payments:995,median:142070,icon:'בית'},
    health:{label:'בריאות',ministry:'משרד הבריאות',entities:303,payments:952,median:54709,icon:'+'},
    aliyah:{label:'עלייה וקליטה',ministry:'משרד העלייה והקליטה',entities:312,payments:1276,median:39794,icon:'עוגן'},
    agriculture:{label:'חקלאות וביטחון מזון',ministry:'משרד החקלאות וביטחון המזון',entities:172,payments:384,median:178815,icon:'עלה'},
    environment:{label:'סביבה וקיימות',ministry:'המשרד להגנת הסביבה',entities:88,payments:341,median:123930,icon:'טיפה'},
    other:{label:'תחום אחר',ministry:'משרדי הממשלה',icon:'…'}
  };
  const QUESTIONS=[
    {key:'legal',eyebrow:'קודם כל, מי אתם?',title:'איך הארגון שלכם רשום?',options:[['nonprofit','עמותה, חל״צ או הקדש ציבורי','גוף ללא מטרות רווח'],['public','רשות או מוסד ציבורי אחר'],['unknown','לא בטוח מה ההגדרה המדויקת']]},
    {key:'tenure',eyebrow:'קצת על הפעילות',title:'כמה זמן הארגון פעיל בפועל?',note:'ותק משנה בהרבה מסלולים, אבל לא בכולם.',options:[['under2','פחות משנתיים'],['2to4','שנתיים עד ארבע'],['5plus','חמש שנים ומעלה']]},
    {key:'compliance',eyebrow:'סטטוס רגולטורי',title:'יש לכם אישור ניהול תקין תקף?',options:[['yes','כן, יש לנו אישור תקף'],['no','אין לנו כרגע']]},
    {key:'turnover',eyebrow:'קצת על ההיקף הכספי',title:'מה היקף המחזור הכספי השנתי של הארגון?',options:[['under500k','עד 500 אלף ₪'],['500kto8m','500 אלף עד 8 מיליון ₪'],['over8m','מעל 8 מיליון ₪']]},
    {key:'domain',eyebrow:'איפה אתם פועלים?',title:'מהו תחום הפעילות המרכזי?',note:'בחרו את הכי קרוב. זו חלוקה כללית בלבד.'},
    {key:'history',eyebrow:'ניסיון מול המדינה',title:'האם ביקשתם בעבר תמיכה מהמדינה?',options:[['received','כן, וגם קיבלנו תמיכה'],['applied','הגשנו, אך לא קיבלנו'],['never','מעולם לא הגשנו'],['unknown','לא יודע / לא הייתי מעורב']]},
    {key:'monitoring',eyebrow:'השאלה האחרונה',title:'מי בודק עבורכם הזדמנויות חדשות?',options:[['professional','איש מקצוע עוקב עבורנו באופן שוטף'],['sometimes','בודקים מדי פעם, כששומעים על משהו'],['rarely','אין אצלנו מעקב מסודר'],['none','אף אחד לא בודק כרגע']]}
  ];
  const state={screen:'entry',step:0,answers:{},locked:false};
  const main=document.getElementById('simulator-main');
  const contextPanel=document.querySelector('.context-panel');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const num=n=>new Intl.NumberFormat('he-IL').format(n);
  const track=(name,params)=>{ try{ if(typeof gtag==='function') gtag('event',name,params||{}); }catch(e){} };
  function answerLabel(key,value){
    const q=QUESTIONS.find(x=>x.key===key);
    if(!q||!q.options) return value;
    const opt=q.options.find(o=>o[0]===value);
    return opt?opt[1]:value;
  }
  function button(label,id,extra=''){return `<button class="primary-button" id="${id}">${label}${extra?` <span class="arrow">${extra}</span>`:''}</button>`}
  function getResult(){const a=state.answers;let score=0;if(['nonprofit','public'].includes(a.legal))score+=2;if(['2to4','5plus'].includes(a.tenure))score+=2;if(['never','unknown'].includes(a.history))score+=2;if(a.history==='applied')score+=1;if(['none','rarely'].includes(a.monitoring))score+=2;if(a.monitoring==='sometimes')score+=1;
    if(a.history==='received'||a.monitoring==='professional')return{tone:'strong',kicker:'אתם כבר בתוך המשחק',title:'עכשיו כדאי לבדוק אם אתם ממקסמים את מה שכבר התחלתם',intro:'כבר יש לכם ניסיון עם תמיכות — זה יתרון. השאלה כאן היא לא אם להתחיל, אלא אם יש עוד מסלולים שלא בדקתם.'};
    if(score>=7)return{tone:'strong',kicker:'יש כאן סימנים שכדאי לבדוק',title:'יכול להיות שאתם משאירים הזדמנות על השולחן',intro:'זו לא קביעת זכאות. אבל יש כאן כמה סימנים טובים ביחד — סוג הארגון, הוותק, ושאף אחד לא עוקב אצלכם באופן קבוע. שווה בדיקה ממוקדת.'};
    if(score>=4)return{tone:'medium',kicker:'שווה בדיקה ראשונית',title:'יש אצלכם כמה סימנים מעניינים',intro:'לא כל קול קורא יתאים לכם, אבל יש כאן מספיק כדי לבדוק במקום לנחש.'};
    return{tone:'open',kicker:'התמונה עדיין פתוחה',title:'אי אפשר לקבוע בלי בירור קצר נוסף',intro:'לא מצאנו כאן התאמה ברורה, אבל גם לא פסלנו כלום. לפעמים המסלול הנכון מסתתר בפרטים שלא שאלנו.'}}
  function render(){
    if(state.screen==='entry')main.innerHTML=`<div class="entry-screen screen-enter"><span class="pill">בדיקת הזדמנות חינמית · כדקה</span><h1>יכול להיות שהארגון שלכם משאיר תמיכה ממשלתית על השולחן?</h1><p class="lead-copy">ענו על שבע שאלות קצרות וקבלו תמונת מצב ראשונית — על בסיס נתוני תמיכות אמיתיים לפי סעיף 3א.</p>${button('בואו נבדוק','start','←')}<p class="microcopy">ללא התחייבות · אין צורך במסמכים · זו אינה בדיקת זכאות</p></div>`;
    if(state.screen==='question'){const q=QUESTIONS[state.step];let choices='';if(q.key==='domain'){choices=`<div class="domain-grid">${Object.entries(DOMAINS).map(([key,d])=>`<button class="domain-option" data-value="${key}"><span class="domain-icon">${esc(d.icon)}</span><span>${esc(d.label)}</span></button>`).join('')}</div>`}else{choices=`<div class="options-list">${q.options.map(o=>`<button class="answer-option" data-value="${o[0]}"><span><strong>${esc(o[1])}</strong>${o[2]?`<small>${esc(o[2])}</small>`:''}</span><span class="option-arrow">←</span></button>`).join('')}</div>`}main.innerHTML=`<div class="question-screen screen-enter"><div class="progress-row"><span>שאלה ${state.step+1} מתוך ${QUESTIONS.length}</span><div class="progress-track"><div class="progress-value" style="width:${((state.step+1)/QUESTIONS.length)*100}%"></div></div></div><span class="question-eyebrow">${esc(q.eyebrow)}</span><h2>${esc(q.title)}</h2>${q.note?`<p class="question-note">${esc(q.note)}</p>`:''}${choices}${state.step>0?'<button class="back-button" id="back">חזרה לשאלה הקודמת</button>':''}</div>`}
    if(state.screen==='result'){const r=getResult(),a=state.answers,d=DOMAINS[a.domain]||DOMAINS.other;const data=d.entities?`<div class="data-card"><div class="data-card-head"><span>מה קרה בתחום ${esc(d.label)} בפועל?</span><span class="data-source">נתוני עבר</span></div><div class="metrics"><div><strong>${num(d.entities)}</strong><span>עמותות נתמכות</span></div><div><strong>${num(d.payments)}</strong><span>תשלומי תמיכה</span></div><div><strong>₪${num(d.median)}</strong><span>חציון לתשלום</span></div></div><p>אלה תשלומים שכבר קרו בעבר, דרך ${esc(d.ministry)}. הם לא אומרים כלום על הזכאות שלכם או על הסכום שתקבלו.</p></div>`:`<div class="data-card no-data"><strong>התחום שלכם לא נכנס יפה לקופסה אחת — וזה דווקא סימן טוב לבדיקה אנושית.</strong><p>קולות קוראים רבים חוצים תחומים ומשרדים, ולכן סיווג כללי עלול לפספס הזדמנות רלוונטית.</p></div>`;let reasons=[];if(['2to4','5plus'].includes(a.tenure))reasons.push('יש לארגון ותק — סימן בסיס שחוזר במסלולים רבים.');if(['never','unknown'].includes(a.history))reasons.push('לא מיציתם עד היום את ערוץ התמיכות באופן ברור.');if(a.history==='received')reasons.push('כבר הוכחתם יכולת לעבוד מול מסלול ממשלתי — עכשיו אפשר לבדוק הרחבה.');if(a.history==='applied')reasons.push('ניסיון הגשה קודם יכול לעזור לזהות במהירות מה השתנה ומה חסר.');if(['none','rarely','sometimes'].includes(a.monitoring))reasons.push('אין אצלכם מעקב רציף, ולכן קל לפספס חלונות הגשה קצרים.');if(a.monitoring==='professional')reasons.push('כבר יש לכם מעקב מקצועי; בדיקה נוספת יכולה להתמקד במסלולים משלימים.');if(d.entities)reasons.push('המאגר מציג פעילות ממשלתית מוכחת בתחום שבחרתם.');if(a.compliance==='yes')reasons.push('יש לכם אישור ניהול תקין תקף — תנאי סף שכבר עברתם ברוב המסלולים.');const complianceWarning=a.compliance==='no'?`<div class="data-card no-data"><strong>שימו לב: אין לכם כרגע אישור ניהול תקין תקף.</strong><p>ברוב מסלולי התמיכה זהו תנאי סף. אפשר וכדאי להמשיך ולבדוק בכל זאת, אבל שווה לטפל בזה במקביל — <a href="orderly-management.html">כל מה שצריך לדעת על ניהול תקין</a>.</p></div>`:'';main.innerHTML=`<div class="result-screen screen-enter"><span class="result-kicker ${r.tone}">${esc(r.kicker)}</span><h2>${esc(r.title)}</h2><p class="result-intro">${esc(r.intro)}</p>${data}${complianceWarning}<div class="reasons"><h3>למה שווה לבדוק?</h3><ul>${reasons.map(x=>`<li><span>✓</span>${esc(x)}</li>`).join('')}</ul></div>${button('בדקו מה עשוי להתאים לנו','lead','←')}<button class="restart-button" id="reset">התחל מחדש</button></div>`;track('support_check_result_tier',{tier:r.tone})}
    if(state.screen==='lead')main.innerHTML=`<div class="lead-screen screen-enter"><button class="close-button" id="close" aria-label="חזרה לתוצאה">×</button><span class="pill">השלב הבא</span><h2>בדיקה קצרה עם בן אדם שמכיר את השטח</h2><p>השאירו פרטים ונבדוק אילו מסלולים מתאימים לארגון שלכם — בלי הבטחות לפני שרואים את התמונה המלאה.</p><div class="disclosure"><strong>גילוי נאות:</strong> יש לנו הסכם שיתוף פעולה עסקי עם 'משאבים'. הבדיקה כאן היא של התצפית, ואנחנו אלה שיחזרו אליכם ראשונים — ההסכם לא משנה את ההמלצה, אבל מגיע לכם לדעת שהוא קיים. אם יהיה רלוונטי, נחבר אתכם אליהם בהמשך.</div><p>בלחיצה על שלח תיפתח תיבת הדואר האלקטרוני עם מייל מוכן לשליחה.</p><form id="lead-form"><label>שם מלא<input required name="name" autocomplete="name"></label><label>שם הארגון<input required name="organization" autocomplete="organization"></label><label>טלפון<input required name="phone" type="tel" autocomplete="tel"></label>${button('שלח בקשה','submit','←')}</form></div>`;
    if(state.screen==='thanks')main.innerHTML=`<div class="thanks-screen screen-enter"><div class="thanks-mark">✓</div><h2>קיבלנו, תודה!</h2><p>נפתח עבורכם מייל מוכן עם הפרטים שמילאתם — פשוט לשלוח אותו, ונחזור אליכם בהקדם.</p>${button('בדקו ארגון נוסף','reset')}</div>`;
    contextPanel.classList.toggle('hide-on-mobile', state.screen==='question');
    bind();
  }
  function bind(){
    document.getElementById('start')?.addEventListener('click',()=>{track('support_check_started');state.screen='question';render()});
    document.querySelectorAll('[data-value]').forEach(el=>el.addEventListener('click',()=>{if(state.locked)return;state.locked=true;document.querySelectorAll('[data-value]').forEach(button=>button.disabled=true);const q=QUESTIONS[state.step];state.answers[q.key]=el.dataset.value;track('support_check_question_answered',{question:q.key});if(state.step===QUESTIONS.length-1){state.screen='result';track('support_check_completed')}else state.step++;setTimeout(()=>{state.locked=false;render()},160)}));
    document.getElementById('back')?.addEventListener('click',()=>{state.step--;render()});
    document.getElementById('lead')?.addEventListener('click',()=>{track('support_check_lead_opened');state.screen='lead';render()});
    document.getElementById('close')?.addEventListener('click',()=>{state.screen='result';render()});
    document.getElementById('lead-form')?.addEventListener('submit',function(e){
      e.preventDefault();
      const submitBtn=document.getElementById('submit');
      if(submitBtn) submitBtn.disabled=true;
      const fd=new FormData(e.target);
      const name=fd.get('name'), organization=fd.get('organization'), phone=fd.get('phone');
      const a=state.answers, r=getResult(), d=DOMAINS[a.domain]||DOMAINS.other;
      const bodyLines=[
        'שם: '+name,
        'ארגון: '+organization,
        'טלפון: '+phone,
        '',
        'תחום: '+d.label,
        'מבנה משפטי: '+answerLabel('legal',a.legal),
        'ותק: '+answerLabel('tenure',a.tenure),
        'ניהול תקין: '+answerLabel('compliance',a.compliance),
        'מחזור כספי שנתי: '+answerLabel('turnover',a.turnover),
        'ניסיון מול סעיף 3א: '+answerLabel('history',a.history),
        'מעקב אחרי הזדמנויות: '+answerLabel('monitoring',a.monitoring),
        'רמת ההתאמה (פנימי): '+r.kicker,
        '',
        'הגיע מ"בדיקת הזדמנות תמיכה" באתר התצפית'
      ];
      const mailto='mailto:hatazpit.office@gmail.com'
        +'?subject='+encodeURIComponent('בדיקת הזדמנות תמיכה — '+organization)
        +'&body='+encodeURIComponent(bodyLines.join('\n'));
      track('support_check_lead_submitted',{tier:r.tone,domain:a.domain});
      window.location.href=mailto;
      state.screen='thanks';render();
    });
    document.getElementById('reset')?.addEventListener('click',()=>{state.screen='entry';state.step=0;state.answers={};render()});
  }
  render();
</script>
</body>
</html>
